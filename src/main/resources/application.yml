server:
  # Railway injects PORT at runtime.
  port: ${PORT:80}

spring:
  application:
    name: credit-passport

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update

  datasource:
    # Prefer explicit Spring datasource vars, fallback to Railway Postgres vars.
    url: jdbc:postgresql://localhost:5432/credit_passport
    username: finance
    password: Pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_USERNAME}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
      jwt:
        secret: ${JWT_SECRET}
        expiration-ms: ${EXPIRATION_MS}
        refresh-token-expiry-days: 2

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://16.171.148.5:8080}
  mail:
    from: ${MAIL_FROM}

